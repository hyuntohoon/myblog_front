name: Deploy Front (S3+CF)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Least privilege: default GITHUB_TOKEN is too broad; this workflow only reads this repo.
# (The workspace-contracts checkout uses its own WORKSPACE_GITHUB_TOKEN PAT, not GITHUB_TOKEN.)
# The AWS deploy needs `id-token: write` on top of this, but it is granted on the `deploy` job
# alone — see there — so `check`, which runs on every pull request, cannot mint an OIDC token.
permissions:
  contents: read

# Serialize prod deploys so out-of-order pushes can't overwrite newer S3/CloudFront content.
concurrency:
  # A PR check and a prod deploy are not the same thing and must not share a queue.
  # They did until 2026-08-02. Only ONE run may sit *pending* in a concurrency group,
  # so a PR run that queued while a deploy was in flight was cancelled before it ran a
  # single job — and a cancelled run reports **no check at all** on the PR, not a red
  # one. A missing gate reads like "nothing to wait for", which is the dangerous shape:
  # the merge rule requires green CI, and absent CI can be mistaken for satisfied CI.
  # (Observed on front #333; the PR run died with zero jobs at 08:02:21Z behind the
  # deploy of the preceding merge. Rare until now — it needs a deploy in flight at the
  # moment a PR queues — but concurrent sessions make that ordinary.)
  #
  # Prod deploys stay serialized under the single group they always had.
  # PR runs get one group per PR and supersede themselves, so a fixup push cancels the
  # older run of the SAME PR (wanted) and nothing else (the bug).
  group: ${{ github.event_name == 'pull_request' && format('front-pr-{0}', github.event.number) || 'front-deploy-prod' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: pnpm/action-setup@v3
        with:
          version: 10

      - name: Get pnpm store directory
        id: pnpm-cache
        run: echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - run: pnpm install --frozen-lockfile

      - name: Checkout workspace contracts (for types-in-sync check)
        uses: actions/checkout@v4
        with:
          repository: hyuntohoon/myblog-workspace
          token: ${{ secrets.WORKSPACE_GITHUB_TOKEN }}
          sparse-checkout: docs/contracts
          sparse-checkout-cone-mode: false
          path: _workspace

      - name: Verify api.gen.ts is in sync with merged spec
        run: |
          pnpm exec openapi-typescript _workspace/docs/contracts/openapi.json -o src/lib/api.gen.ts.ci
          diff src/lib/api.gen.ts src/lib/api.gen.ts.ci || (echo "ERROR: api.gen.ts is out of sync. Run 'pnpm generate:types' and commit." && rm src/lib/api.gen.ts.ci && exit 1)
          rm src/lib/api.gen.ts.ci

      - name: Type check
        run: pnpm exec astro check

      - name: Lint
        run: pnpm lint

      - name: Unit tests
        run: pnpm test

  deploy:
    needs: check
    # Production deploy is main-only. push already filters to main (on.push.branches), but
    # workflow_dispatch can be invoked against ANY ref, so guard the ref explicitly — otherwise
    # a dispatch from a feature branch would ship that branch's code to prod.
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
      && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Job-level permissions REPLACE the workflow-level block, so `contents: read` is
    # restated here rather than inherited. `id-token: write` is what lets this job mint
    # the OIDC token it trades for the AWS role — it is granted to this job only, so the
    # `check` job (which runs on every PR, including from a fork) cannot request one.
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: pnpm/action-setup@v3
        with:
          version: 10

      - name: Get pnpm store directory
        id: pnpm-cache
        run: echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - run: pnpm install --frozen-lockfile

      - name: Build Astro
        env:
          NODE_ENV: production
          PUBLIC_API_URL: ${{ vars.PUBLIC_API_URL }}
          PUBLIC_BACKEND_API_URL: ${{ vars.PUBLIC_API_URL }}
          PUBLIC_COGNITO_DOMAIN: ${{ secrets.PUBLIC_COGNITO_DOMAIN }}
          PUBLIC_COGNITO_CLIENT_ID: ${{ secrets.PUBLIC_COGNITO_CLIENT_ID }}
          PUBLIC_COGNITO_USER_POOL_ID: ${{ secrets.PUBLIC_COGNITO_USER_POOL_ID }}
          PUBLIC_COGNITO_REDIRECT_URI: ${{ secrets.PUBLIC_COGNITO_REDIRECT_URI }}
          # 3b-e: Spotify OAuth client id (public by design — it appears in the
          # authorize URL). Repo VARIABLE, owner-set; empty ⇒ the connect button
          # renders disabled and no authorize URL is built.
          PUBLIC_SPOTIFY_CLIENT_ID: ${{ vars.PUBLIC_SPOTIFY_CLIENT_ID }}
        run: pnpm build

      # SEC-system-hardening Step 3: OIDC, not a long-lived key. The action trades this
      # job's OIDC token for a ~1h session on a role whose trust policy pins
      # `sub` to `repo:hyuntohoon/myblog_front:ref:refs/heads/main` with StringEquals —
      # a run from any other ref, repo, or event type cannot assume it. The role can do
      # exactly four things: list myblog-prod-web, put and delete objects under it, and
      # invalidate this one CloudFront distribution. See infra/github_oidc.tf.
      #
      # AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY remain set as repo secrets and are now
      # unused; they are deleted only after this lane is confirmed green in production.
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: gha-front-deploy-${{ github.run_id }}
          aws-region: ${{ secrets.AWS_REGION }}

      # 1) Hashed static assets — cache forever
      - name: Upload _astro/** (immutable)
        run: |
          aws s3 sync dist/_astro/ s3://${{ secrets.S3_BUCKET_WEB }}/_astro/ \
            --cache-control "public, max-age=31536000, immutable"

      # 2) HTML, XML, JSON — always revalidate. The unqualified --delete also
      #    purges the stale /pagefind/* objects (search is now the in-app global
      #    search; FEAT-global-search removed Pagefind).
      - name: Upload HTML/XML/JSON (no-cache)
        run: |
          aws s3 sync dist/ s3://${{ secrets.S3_BUCKET_WEB }} \
            --delete \
            --exclude "_astro/*" \
            --cache-control "no-cache"

      # 4) CloudFront cache invalidation
      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.CF_DIST_ID }} \
            --paths "/*"

      # OPS-delivery-safety-gates Step 3 — post-deploy health smoke (health-only,
      # no credentials). Content is already live in S3/CloudFront here, so this is
      # detect-and-alert-fast + rollback trigger, NOT a pre-cutover gate. A red run
      # means: roll back (re-run the previous green deploy, or restore the previous
      # dist/ to S3 + invalidate). Retries absorb CloudFront invalidation lag.
      - name: Post-deploy smoke (health)
        env:
          RUN_ID: ${{ github.run_id }}
        run: |
          URL="https://www.ratemymusic.blog/?_cb=${RUN_ID}"
          for i in 1 2 3 4 5; do
            if curl -fsS --max-time 15 -o /tmp/home.html "$URL" && grep -qi '<html' /tmp/home.html; then
              echo "Front health OK."
              exit 0
            fi
            echo "attempt $i: health not green yet, retrying in 5s…"
            sleep 5
          done
          echo "::error::Front health smoke FAILED — homepage did not return HTML. Roll back the deploy."
          exit 1
